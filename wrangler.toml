name = "og-cdn"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Fonts ship inside the bundle as raw bytes so a render never waits on a
# third party font host. Subset to latin, roughly 110 KB for all three.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
# The one setting that matters in production. Give it the full absolute base,
# path included. Routing strips this path, and every generated og:image URL is
# absolute against it, so a build box hitting the workers.dev origin still
# emits tags pointing at the public hostname.
PUBLIC_BASE = "https://cdn.jakelabate.com/open-graph"

# Which hosts a logo may be fetched from. Without this the render endpoint is
# an open image proxy: anyone can pass ?logo=<any https url> and have the
# worker fetch it on this account. Subdomains of a listed host are accepted.
LOGO_ALLOWED_HOSTS = "jakelabate.com"

# Optional. Set with: wrangler secret put SIGNING_KEY
# When present, /v1/og.png requires a matching sig and /v1/tags mints it.

[observability]
enabled = true

# A custom domain, because the hostname is dedicated to this worker.
#
# `wrangler deploy` creates the proxied DNS record and provisions the
# certificate. Nothing to add by hand, and no grey cloud to get wrong.
#
# The worker owns the whole hostname, and serves under /open-graph because the
# mount lives in code rather than in the route. If cdn.jakelabate.com later has
# to serve something else, swap this block for the path scoped route below and
# every published URL keeps working:
#
#   [[routes]]
#   pattern = "cdn.jakelabate.com/open-graph*"
#   zone_name = "jakelabate.com"
#
# A route does not create a hostname, so that swap also means adding a proxied
# AAAA record for cdn pointing at 100::, the IPv6 discard prefix. Grey cloud
# means Cloudflare answers with the origin address and never runs the worker.
[[routes]]
pattern = "cdn.jakelabate.com"
custom_domain = true
