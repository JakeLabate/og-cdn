name = "og-cdn"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Fonts ship inside the bundle as raw bytes so a render never waits on a
# third party font host. Subset to latin, roughly 110 KB for all three.
[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[vars]
# The one setting that matters in production. Give it the full absolute base,
# path included. Routing strips this path, and every generated og:image URL is
# absolute against it, so a build box hitting the workers.dev origin still
# emits tags pointing at the public hostname.
PUBLIC_BASE = "https://cdn.jakelabate.com/open-graph"

# Which hosts a logo may be fetched from. Without this the render endpoint is
# an open image proxy: anyone can pass ?logo=<any https url> and have the
# worker fetch it on this account. Subdomains of a listed host are accepted.
LOGO_ALLOWED_HOSTS = "jakelabate.com"

# Optional. Set with: wrangler secret put SIGNING_KEY
# When present, /v1/og.png requires a matching sig and /v1/tags mints it.

[observability]
enabled = true

# A path scoped route, because cdn.jakelabate.com is shared. ctx-cards serves
# /context-cards/* from its own worker on the same hostname.
#
# This was a custom domain while this worker was the only thing on the host. A
# custom domain claims the whole hostname, so Cloudflare refuses a route for a
# second worker on it. Routes are what let two workers share one host.
#
# A route does not create a hostname the way a custom domain does. Removing the
# custom domain removes the DNS record with it, so the record has to be added
# back by hand, proxied:
#
#   Type AAAA   Name cdn   Content 100::   Proxy ON (orange)
#
# 100:: is the IPv6 discard prefix, the standard placeholder for a hostname that
# exists only to be intercepted by a worker. Grey cloud means Cloudflare answers
# with that address and never runs the worker.
#
# The mount path never came from the route, so every published URL is unchanged
# by this swap.
[[routes]]
pattern = "cdn.jakelabate.com/open-graph*"
zone_name = "jakelabate.com"
